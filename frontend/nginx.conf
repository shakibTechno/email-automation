# ---------------------------------------------------------------------------
# Serves the built React SPA and proxies every backend-owned path to Django.
# Because the API is reached through this same origin, the browser never makes
# a cross-origin request and VITE_API_URL can stay a relative path.
# ---------------------------------------------------------------------------
upstream backend {
    server backend:8000;
}

# Preserve the scheme the *client* used, not the one on this hop.
#
# In production a TLS terminator sits in front and sets X-Forwarded-Proto to
# https, but this server listens on plain port 80, so $scheme is "http". Passing
# $scheme straight through overwrites the header, Django's
# SECURE_PROXY_SSL_HEADER then reads "http", SECURE_SSL_REDIRECT fires, and
# every request becomes an endless 301.
#
# Falls back to $scheme when nothing is in front, which is the local case.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    # Long-lived hashed build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- Django-owned routes -------------------------------------------------
    # $http_host (not $host) preserves the port, which Django needs for its
    # CSRF origin check on the admin.
    # Everything Django serves directly. `webhooks` matters more than it looks:
    # without it the SPA fallback answers POST /webhooks/postal with index.html
    # and HTTP 200, so the mail server records every delivery event as
    # successfully delivered while Django never sees one.
    location ~ ^/(api|admin|static|media|track|unsubscribe|webhooks|p)/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 120s;
        proxy_redirect     off;
    }

    # The website snippet. An exact match, because the proxy regex above
    # requires a trailing slash and /t.js has none -- without this it falls
    # through to the SPA and a customer's <script src> loads index.html as
    # JavaScript.
    #
    # $forwarded_proto, not $scheme: Caddy terminates TLS, so $scheme is http
    # in here and Django's SECURE_SSL_REDIRECT answers every request with a
    # 301 to the address it was just asked for.
    location = /t.js {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_redirect     off;
    }

    # --- Public forms, which exist to be embedded ----------------------------
    # Framing is denied everywhere else, which forbids *all* framing including
    # same-origin. That silently broke the two features whose whole purpose is
    # an iframe: the "Embed & Share" snippet handed to customers for their own
    # sites, and forms embedded in landing pages
    # (LandingPageService._embedded_form_body writes an iframe pointing here).
    #
    # This route opts out, and only this route. `frame-ancestors *` states the
    # intent in the modern header rather than just omitting the old one, and
    # the clickjacking protection stays on every authenticated screen. A public
    # form carries no session, so there is nothing to clickjack.
    #
    # `try_files /index.html` and not `try_files $uri $uri/ /index.html`: the
    # three-argument form falls back by *internal redirect* to /index.html,
    # which re-runs location matching and lands in `location /` below — so the
    # headers set here were discarded and the SPA's DENY applied instead. Naming
    # the file as a file serves it inside this location, where these headers
    # hold. Verified by curl, because the two forms are indistinguishable until
    # you look at a response.
    location ~ ^/f/ {
        add_header Content-Security-Policy "frame-ancestors *" always;
        try_files /index.html =404;
    }

    # --- SPA -----------------------------------------------------------------
    # Client-side routes (/dashboard, ...) must fall back to index.html.
    #
    # The frame policy is set here, not in the TLS terminator, because only
    # this layer can see which path is being served. It matters for the SPA
    # specifically: /dashboard is this same index.html, served without Django
    # ever seeing the request, so Django's X_FRAME_OPTIONS cannot cover it.
    location / {
        add_header X-Frame-Options DENY always;
        try_files $uri $uri/ /index.html;
    }
}
