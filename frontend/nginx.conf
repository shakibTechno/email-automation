# ---------------------------------------------------------------------------
# Serves the built React SPA and proxies every backend-owned path to Django.
# Because the API is reached through this same origin, the browser never makes
# a cross-origin request and VITE_API_URL can stay a relative path.
# ---------------------------------------------------------------------------
upstream backend {
    server backend:8000;
}

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    # Long-lived hashed build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- Django-owned routes -------------------------------------------------
    # $http_host (not $host) preserves the port, which Django needs for its
    # CSRF origin check on the admin.
    # Everything Django serves directly. `webhooks` matters more than it looks:
    # without it the SPA fallback answers POST /webhooks/postal with index.html
    # and HTTP 200, so the mail server records every delivery event as
    # successfully delivered while Django never sees one.
    location ~ ^/(api|admin|static|media|track|unsubscribe|webhooks|p)/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 120s;
        proxy_redirect     off;
    }

    # --- SPA -----------------------------------------------------------------
    # Client-side routes (/dashboard, /f/:id, ...) must fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
