# ---------------------------------------------------------------------------
# Full stack: redis, Django backend, Celery worker, Celery beat, React frontend.
#
#   docker compose up --build          -> dev mode  (override file applies:
#                                         hot reload for both backend + frontend)
#   docker compose -f docker-compose.yml up --build
#                                      -> prod-like (gunicorn + nginx, no mounts)
#
# Database is PostgreSQL. SQLite is still supported for a quick throwaway run
# by pointing DATABASE_URL at a file, but it allows only one writer at a time
# and the backend, worker and beat all write concurrently, so it is not a
# sensible default once anything is actually sending.
#
# The `app_data` volume holds runtime state that is not the database: the
# Celery beat schedule, and a SQLite file if you opt back into it.
# ---------------------------------------------------------------------------

x-backend-base: &backend-base
  build:
    context: .
    dockerfile: Dockerfile
  image: email-automation-backend:latest
  env_file:
    - .env
    - .env.docker
  volumes:
    - app_data:/app/data
    - media_data:/app/media
    - static_data:/app/staticfiles
    - logs_data:/app/logs
  depends_on:
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  # --- PostgreSQL ----------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-email_automation}
      POSTGRES_USER: ${POSTGRES_USER:-email_automation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-email_automation}
      # Postgres rebuilds its collation indexes if the locale changes between
      # image versions; pinning it keeps upgrades uneventful.
      LANG: C
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Not published by default: only the backend, worker and beat need it.
    # Uncomment to inspect it with a local client such as psql or TablePlus.
    # ports:
    #   - "${POSTGRES_PORT:-5432}:5432"
    expose:
      - "5432"
    healthcheck:
      # -U matters: without it pg_isready checks the "root" role, which does
      # not exist, and reports the server unhealthy while it is perfectly fine.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-email_automation} -d ${POSTGRES_DB:-email_automation}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # --- Redis: cache (db 0) + Celery broker/result backend (db 1) ------------
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    # Deliberately not published: only backend/worker/beat need it, and binding
    # 6379 clashes with a redis-server already running on the host.
    # Inspect it with:  docker compose exec redis redis-cli
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # --- Django API ----------------------------------------------------------
  backend:
    <<: *backend-base
    environment:
      # Only this container owns the schema; worker and beat wait for it.
      RUN_MIGRATIONS: "1"
    volumes:
      - app_data:/app/data
      - media_data:/app/media
      - static_data:/app/staticfiles
      - logs_data:/app/logs
      # Only used when DATABASE_URL points at SQLite: carries an existing local
      # db.sqlite3 into the volume on first boot. Ignored under postgres.
      - ./db.sqlite3:/app/seed/db.sqlite3:ro
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # --- Celery worker -------------------------------------------------------
  worker:
    <<: *backend-base
    command: ["celery", "-A", "config", "worker", "--loglevel=info", "--concurrency=4"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # --- Celery beat (scheduler) --------------------------------------------
  beat:
    <<: *backend-base
    command:
      - celery
      - -A
      - config
      - beat
      - --loglevel=info
      - --schedule=/app/data/celerybeat-schedule
      - --pidfile=
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy

  # --- React frontend behind nginx ----------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
      args:
        VITE_API_URL: /api/v1
    image: email-automation-frontend:latest
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  app_data:
  media_data:
  static_data:
  logs_data:
  redis_data:
