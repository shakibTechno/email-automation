# ---------------------------------------------------------------------------
# Production overlay. Use alongside the base file, never on its own:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# What it changes:
#   * puts Caddy in front, terminating TLS for APP_HOST with an automatic
#     Let's Encrypt certificate
#   * stops publishing the backend and frontend ports, so the only way in is
#     through Caddy on 80/443
#   * builds DATABASE_URL from the POSTGRES_* values in .env rather than the
#     development defaults baked into .env.docker
#   * runs the production settings module
#
# Requires in .env: APP_HOST, POSTGRES_PASSWORD, SECRET_KEY, and the POSTAL_*
# values. See .env.example.
# ---------------------------------------------------------------------------

x-django-env: &django-env
  DJANGO_SETTINGS_MODULE: config.settings.production
  # `environment:` wins over `env_file:`, which is the point — .env.docker
  # carries the development credentials and is tracked in git, so the real
  # password has to arrive this way, substituted from the untracked .env.
  DATABASE_URL: postgres://${POSTGRES_USER:-email_automation}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-email_automation}

  # These are all set in .env.docker too, and env_file entries apply in order,
  # so the development values there would otherwise win over .env and Django
  # would answer every proxied request with "Invalid HTTP_HOST header".
  ALLOWED_HOSTS: ${ALLOWED_HOSTS}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
  BASE_URL: ${BASE_URL}
  FRONTEND_URL: ${FRONTEND_URL}
  BACKEND_URL: ${BACKEND_URL}
  # ALLOWED_HOSTS above is now the *platform* host list (settings read it as
  # the PLATFORM_HOSTS default); Django's own ALLOWED_HOSTS is ['*'] because
  # customers connect their own landing-page domains at runtime and
  # LandingHostMiddleware is the gate. Set PLATFORM_HOSTS explicitly to
  # decouple the two.
  PLATFORM_HOSTS: ${PLATFORM_HOSTS:-}
  # The CNAME value shown to customers for them to publish. Must resolve to
  # this server; a dedicated name such as pages.<your domain> is tidier than
  # reusing the app host, because it can be repointed without moving the app.
  LANDING_DOMAIN_CNAME_TARGET: ${LANDING_DOMAIN_CNAME_TARGET:-}

services:
  backend:
    environment:
      <<: *django-env
      RUN_MIGRATIONS: "1"
    # Reachable only through Caddy.
    ports: !override []

  worker:
    environment:
      <<: *django-env

  beat:
    environment:
      <<: *django-env

  frontend:
    ports: !override []

  # --- TLS terminator ------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    environment:
      APP_HOST: ${APP_HOST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and the ACME account live here. Losing this volume means
      # re-issuing from Let's Encrypt, which is rate limited — keep it.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
